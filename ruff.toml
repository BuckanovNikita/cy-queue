# Native Ruff configuration. Check commands live in AGENTS.md.
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[lint]
select = ["ALL"]
# Enable preview rules while keeping the stable formatter.
preview = true
ignore = [
    # Raise short validation and operational diagnostics directly where the failure occurs.
    "EM101", "EM102", "TRY003",
    # Source files do not carry individual copyright headers.
    "CPY001",
    # Document contracts and constraints. Classes, methods, functions and package
    # initializers need no boilerplate docstrings or mandatory Returns/Raises sections.
    "D101", "D102", "D103", "D104", "D107", "DOC201", "DOC501",
    # D211 and D212 select the project's class spacing and summary placement.
    "D203", "D213",
    # The formatter uses trailing commas to preserve multiline layout.
    "COM812", "COM819",
    # Keep already-imported types readable in casts.
    "TC006",
    # Use code-specific noqa comments and identify the same rules by code in this file.
    "RUF105", "RUF201",
]

[lint.per-file-ignores]
# Pytest fixtures and test doubles mirror callable signatures, use private APIs, and
# import dependencies after test setup. Plain test modules need no package initializer.
# Assertions check exact fixture values, including binary-exact floats and empty output.
# Subprocess tests launch real CLI commands and owned children.
"tests/**" = [
    "ANN401", "ARG001", "ARG002", "ARG005", "FBT001", "FBT003", "INP001", "PLC0415",
    "PLC1901", "PLC2701", "PLR2004", "PLR6301", "RUF069", "S101", "S404", "SLF001",
]
# The harness writes JUnit XML with ElementTree.
"tests/ddp_gpu_harness.py" = ["S405"]
# Processes may vanish during any part of a /proc inspection.
"tests/ddp_gpu_worker.py" = ["PLW0717"]
# Release tooling invokes git and semantic-release with argument vectors and reports to stdout.
"scripts/release.py" = ["S404", "S603", "T201"]

# Queue adapters supervise subprocesses and keep stateless operations on their adapter interfaces.
"src/cy_queue/adapters/**" = ["PLR6301", "S404"]
# Bindings and namespace records validate their complete identity before reuse.
"src/cy_queue/adapters/queue/coordination.py" = ["PLR0916"]
# socket.setblocking() takes its flag positionally.
"src/cy_queue/adapters/queue/guardian.py" = ["FBT003"]
# Worker construction accepts independent launch, coordination and memory settings.
"src/cy_queue/adapters/queue/runtime.py" = ["PLR0913"]
# Storage reads translate malformed committed records throughout the read operation.
# Its archive flag implements the positional storage port.
"src/cy_queue/adapters/queue/storage.py" = ["FBT001", "PLW0717"]
# The NVML binding returns opaque device handles and memory records.
"src/cy_queue/adapters/runtime/gpu_resources.py" = ["ANN401"]
# Keep hardware and command dependencies lazy for help, monitoring and CPU-only clients.
"src/cy_queue/adapters/runtime/gpu_probe.py" = ["PLC0415"]
"src/cy_queue/entrypoints/{queue,queue_run}.py" = ["PLC0415"]
# Preserve the positional archive/restore flag on the storage port.
"src/cy_queue/application/queue.py" = ["FBT001", "FBT003"]
# Frozen ResourceRequest validation sets the default with object.__setattr__.
"src/cy_queue/core/queue.py" = ["PLC2801"]
# Snapshot composition needs both job-local Hydra values and submission settings.
"src/cy_queue/entrypoints/hydra/queue_config.py" = ["PLR0913"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use loguru's logger for queue diagnostics."

[lint.isort]
known-first-party = ["cy_queue"]

[lint.mccabe]
max-complexity = 10
